<script type="text/javascript">
    RED.nodes.registerType('gate-plus', {
        category: 'function',
        color: '#f3b567',
        defaults: {
            name: { value: "" },
            controlTopic: { value: "control" },
            defaultState: { value: "open" },
            openCmd: { value: "open" },
            closeCmd: { value: "close" },
            toggleCmd: { value: "toggle" },
            defaultCmd: { value: "default" },
            statusCmd: { value: "status" },
            persist: { value: false },
            storeName: {
                value: (RED.settings.hasOwnProperty('context') && RED.settings.context.default)
                    ? RED.settings.context.default
                    : 'default'
            }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["open", "blocked"],
        icon: "arrow-in.png",
        label: function () {
            return this.name || "gate-plus";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            const node = this;
            if (RED.settings.context && RED.settings.context.stores) {
                RED.settings.context.stores.forEach(function (item) {
                    $('#node-input-storeName').append(
                        $('<option></option>').attr('value', item).text(item)
                    );
                });
            }
            $('#node-input-storeName').val(node.storeName);
            $('#node-input-storeName').prop('disabled', !node.persist);
            $("#node-input-persist").on("change", function () {
                $("#node-input-storeName").prop("disabled", !$(this).prop("checked"));
            });
        }
    });
</script>

<script type="text/x-red" data-template-name="gate-plus">
    <div class="form-row">
        <label for="node-input-controlTopic"><i class="fa fa-cog"></i> Control Topic</label>
        <input type="text" id="node-input-controlTopic" placeholder="control">
    </div>
    <div class="form-row">
        <label for="node-input-defaultState"><i class="fa fa-refresh"></i> Default State</label>
        <select id="node-input-defaultState" style="width:25%;">
            <option value="open">open</option>
            <option value="closed">closed</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-persist" style="width:auto; display:inline">
            <input type="checkbox" id="node-input-persist" style="display:inline-block; width:15px; vertical-align:baseline;">
            <span>Restore from state saved in</span>
        </label>
        <select id="node-input-storeName" style="width:40%"></select>
    </div>
    <br/>
    <div>Commands (case insensitive):</div>
    <br/>
    <div class="form-row">
        <label for="node-input-openCmd"><i class="fa fa-circle-o"></i> Open</label>
        <input type="text" id="node-input-openCmd" placeholder="open">
    </div>
    <div class="form-row">
        <label for="node-input-closeCmd"><i class="fa fa-circle"></i> Close</label>
        <input type="text" id="node-input-closeCmd" placeholder="close">
    </div>
    <div class="form-row">
        <label for="node-input-toggleCmd"><i class="fa fa-arrows-v"></i> Toggle</label>
        <input type="text" id="node-input-toggleCmd" placeholder="toggle">
    </div>
    <div class="form-row">
        <label for="node-input-defaultCmd"><i class="fa fa-dot-circle-o"></i> Default</label>
        <input type="text" id="node-input-defaultCmd" placeholder="default">
    </div>
    <div class="form-row">
        <label for="node-input-statusCmd"><i class="fa fa-info"></i> Status</label>
        <input type="text" id="node-input-statusCmd" placeholder="status">
    </div>
    <br/>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" style="width:50%">
    </div>
</script>

<script type="text/x-red" data-help-name="gate-plus">
    <p>Behaves like the familiar <code>gate</code> node, but instead of
    silently discarding messages while closed, routes them to a
    <b>second output</b> so you can still act on them.</p>
    <p><b>Output 1</b> — messages received while the gate is <code>open</code>.</p>
    <p><b>Output 2</b> — messages received while the gate is <code>closed</code>.</p>
    <p>Messages whose topic matches <code>Control Topic</code> are treated
    as control messages and never appear on either output. Recognised
    commands (each customisable below, case insensitive):</p>
    <ul>
        <li><code>open</code> — open the gate</li>
        <li><code>close</code> — close the gate</li>
        <li><code>toggle</code> — flip the current state</li>
        <li><code>default</code> — return to <code>Default State</code></li>
        <li><code>status</code> — refresh the node's status indicator</li>
    </ul>
    <p>On deploy, or after a <code>default</code> command, the node enters
    <code>Default State</code>. Optionally, enable <code>Restore from
    state saved in</code> to persist state across redeploys/restarts using
    a configured context store.</p>
</script>
